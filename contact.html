<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <title>联系 · 大橘的博客</title>
  <meta name="description" content="给我留言。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">大橘的博客</a>
      <div class="header-actions">
        <button class="theme-toggle" aria-label="切换深色/浅色主题">🌙</button>
        <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="friends.html">友情链接</a>
        <a href="contact.html" class="active">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h1>联系</h1>
      <p>想和我说说话？可以用下面的表单留言，或直接发邮件到 <a href="mailto:wh631q@gmail.com">wh631q@gmail.com</a>。</p>
      <form class="contact-form" action="https://formsubmit.co/wh631q@gmail.com" method="POST">
        <div class="form-row">
          <label for="name">你的称呼</label>
          <input type="text" id="name" name="name" placeholder="怎么称呼你？" required>
        </div>
        <div class="form-row">
          <label for="email">你的邮箱</label>
          <input type="email" id="email" name="email" placeholder="方便我回复你" required>
        </div>
        <div class="form-row">
          <label for="message">想说的话</label>
          <textarea id="message" name="message" rows="6" placeholder="写点什么吧" required></textarea>
        </div>
        <input type="hidden" name="_subject" value="来自「大橘的博客」的新留言">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="thanks.html">
        <button class="btn" type="submit">发送留言</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 大橘的博客 · 由 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> 驱动</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
