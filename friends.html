<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <title>友情链接 · 大橘的博客</title>
  <meta name="description" content="常去的一些地方。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">大橘的博客</a>
      <div class="header-actions">
        <button class="theme-toggle" aria-label="切换深色/浅色主题">🌙</button>
        <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="friends.html" class="active">友情链接</a>
        <a href="contact.html">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h1>友情链接</h1>
      <p>下面是我常去的一些地方。想交换友链的话，欢迎在「联系」页告诉我。</p>
      <ul class="friend-list">
        <li class="friend-item">
          <a href="https://example.com" target="_blank" rel="noopener">
            <span class="friend-name">朋友的名字</span>
            <span class="friend-desc">一句话介绍（示例占位，替换成真的友链）</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 大橘的博客 · 由 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> 驱动</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
